[project]
name = "eth-mempool-monitor"
version = "0.1.0"
description = "Ethereum mempool monitor and Python RPC client utilities"
readme = "README.md"
requires-python = ">=3.9.1"
license = "GPL-3.0-only"
dependencies = [
    "tomli>=2.0.1; python_version < '3.11'",
]

[dependency-groups]
dev = [
    "mdformat==0.7.22",
    "mdformat-ruff==0.1.3",
    "pyright==1.1.414",
    "ruff==0.16.8",
    "yamlfix==1.19.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
src = ["python"]
target-version = "py39"

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint]
select = ["B", "C4", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.yamlfix]
explicit_start = false
line_length = 100
preserve_quotes = true
section_whitelines = 1
sequence_style = "block_style"

[tool.pyright]
exclude = ["**/__pycache__"]
include = ["python", "tests"]
pythonVersion = "3.9"
reportUnnecessaryCast = "warning"
reportUnnecessaryComparison = "warning"
reportUnnecessaryContains = "warning"
reportUnnecessaryTypeIgnoreComment = "warning"
typeCheckingMode = "standard"
