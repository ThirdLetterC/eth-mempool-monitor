name: Compile

on:
  push:
    paths:
      - "src/**/*.c"
      - "include/**/*.h"
      - "build.zig"
      - "build.zig.zon"
      - ".clang-format"
      - ".clang-format-ignore"
      - "justfile"
      - ".github/workflows/compile.yml"
  pull_request:
    paths:
      - "src/**/*.c"
      - "include/**/*.h"
      - "build.zig"
      - "build.zig.zon"
      - ".clang-format"
      - ".clang-format-ignore"
      - "justfile"
      - ".github/workflows/compile.yml"

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang-format \
            libc6-dev \
            libuv1-dev \
            libwolfssl-dev \
            pkg-config

      - name: Install Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0

      - name: Check C formatting
        run: >-
          find src include -type f \( -name '*.c' -o -name '*.h' \)
          -print0 | xargs -0 clang-format --dry-run --Werror

      - name: Compile
        run: |
          zig build
          zig build -Dmimalloc=true
