name: Python quality

on:
  push:
    paths:
      - "**/*.py"
      - "compose*.yml"
      - "docs/PYTHON_CLIENT.md"
      - "pyproject.toml"
      - "uv.lock"
      - "justfile"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "**/*.py"
      - "compose*.yml"
      - "docs/PYTHON_CLIENT.md"
      - "pyproject.toml"
      - "uv.lock"
      - "justfile"
      - ".github/workflows/python.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install Python
        run: uv python install 3.13

      - name: Sync development tools
        run: uv sync --locked --only-dev --python 3.13

      - name: Check formatting
        run: |
          uv run --frozen ruff format --check .
          uv run --frozen mdformat --check docs/PYTHON_CLIENT.md
          uv run --frozen yamlfix --check compose.yml compose.prod.yml

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Type check
        run: uv run --frozen pyright
